<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>ROKA DXB — Commis Training</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0D0D0D;min-height:100vh;color:#FFF;overflow-x:hidden}

  #splash{position:fixed;inset:0;background:#0D0D0D;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;padding:32px;text-align:center;overflow-y:auto}
  #splash .logo{font-size:11px;letter-spacing:4px;color:#666;text-transform:uppercase;margin-bottom:12px}
  #splash h1{font-size:30px;font-weight:900;line-height:1.1;margin-bottom:8px}
  #splash h1 span{color:#E8B84B}
  #splash p{color:#888;font-size:14px;line-height:1.6;margin-bottom:24px;max-width:280px}
  .filter-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:10px}
  .filter-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:24px}
  .filter-btn{padding:7px 14px;border-radius:100px;border:2px solid #333;background:transparent;color:#888;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
  .filter-btn.active{border-color:#E8B84B;color:#E8B84B;background:rgba(232,184,75,.1)}
  .start-btn{background:#E8B84B;color:#0D0D0D;font-size:16px;font-weight:800;padding:16px 40px;border-radius:100px;border:none;cursor:pointer;width:100%;max-width:280px}

  #game-header{background:#0D0D0D;padding:14px 16px 10px;position:sticky;top:0;z-index:50;border-bottom:1px solid #1A1A1A}
  .header-row{display:flex;justify-content:space-between;align-items:center}
  .progress-label{font-size:11px;color:#555;letter-spacing:1px;text-transform:uppercase}
  .header-right{display:flex;align-items:center;gap:10px}
  .score-badge{background:#1A1A1A;border-radius:100px;padding:5px 12px;font-size:12px;font-weight:700;color:#E8B84B}
  .menu-btn{background:#1A1A1A;border:1px solid #2A2A2A;color:#888;font-size:12px;font-weight:600;padding:5px 12px;border-radius:100px;cursor:pointer}
  .progress-bar{height:3px;background:#1A1A1A;border-radius:2px;margin-top:10px}
  .progress-fill{height:100%;background:#E8B84B;border-radius:2px;transition:width .4s ease}

  #card-area{padding:16px}
  .card{background:#161616;border-radius:20px;overflow:hidden;border:1px solid #222}
  .card-emoji{width:100%;height:160px;background:linear-gradient(135deg,#1A1A1A,#252525);display:flex;align-items:center;justify-content:center;font-size:72px}
  .card-body{padding:18px}
  .section-tag{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:5px}
  .spanish-name{font-size:20px;font-weight:800;color:#FFF;margin-bottom:2px;line-height:1.25}

  /* Fish card special */
  .fish-tag{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#4AAAD4;margin-bottom:5px}
  .fish-japanese{font-size:28px;font-weight:900;color:#E8B84B;margin-bottom:4px}
  .fish-spanish{font-size:15px;color:#888;margin-bottom:2px}

  .pronounce-prompt{display:flex;align-items:center;gap:8px;background:#1A1A1A;border-radius:10px;padding:10px 14px;margin:14px 0 10px;cursor:pointer;border:1px solid #2A2A2A;transition:border-color .2s}
  .pronounce-prompt:active{border-color:#E8B84B}
  .pronounce-icon{font-size:20px;flex-shrink:0}
  .pronounce-text{font-size:12px;color:#888;line-height:1.4}
  .pronounce-text strong{color:#E8B84B;display:block;font-size:13px}

  .en-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:10px}
  .word-row{display:flex;flex-wrap:wrap;gap:5px 7px;margin-bottom:16px;align-items:center;line-height:1.8}
  .word-block{position:relative;display:inline-block}
  .word-text{font-size:17px;font-weight:700;color:#FFF;white-space:nowrap}
  .word-cover{position:absolute;inset:-2px -1px;background:#E8B84B;border-radius:4px;transition:transform .45s cubic-bezier(.34,1.56,.64,1),opacity .3s;transform-origin:left center}
  .word-cover.revealed{transform:scaleX(0);opacity:0}
  .word-punct{font-size:17px;font-weight:700;color:#444}

  /* Fish answer blocks */
  .fish-answers{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
  .fish-answer-row{display:flex;flex-direction:column;gap:4px}
  .fish-answer-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#555}
  .fish-word-row{display:flex;flex-wrap:wrap;gap:5px 7px;align-items:center}

  .input-area{display:flex;gap:8px;margin-bottom:10px}
  .guess-input{flex:1;background:#0D0D0D;border:2px solid #2A2A2A;border-radius:12px;padding:12px 14px;color:#FFF;font-size:15px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;outline:none;transition:border-color .2s}
  .guess-input:focus{border-color:#444}
  .guess-input.wrong{border-color:#FF4444;animation:shake .3s}
  .guess-input.right{border-color:#44BB77}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .check-btn{background:#E8B84B;color:#0D0D0D;font-size:15px;font-weight:800;padding:12px 18px;border-radius:12px;border:none;cursor:pointer}

  .status-line{font-size:12px;color:#555;margin-bottom:10px;min-height:18px}
  .hint-row{display:flex;gap:8px;margin-bottom:10px}
  .hint-btn{flex:1;background:#1A1A1A;border:1px solid #252525;color:#666;font-size:12px;font-weight:600;padding:9px 6px;border-radius:10px;cursor:pointer}
  .hint-btn.used{opacity:.3;cursor:not-allowed}
  .reveal-btn{flex:1;background:#1A1A1A;border:1px solid #252525;color:#555;font-size:12px;font-weight:600;padding:9px 6px;border-radius:10px;cursor:pointer}

  .info-box{background:#1A1A1A;border-radius:12px;padding:12px 14px;margin-bottom:10px;display:none}
  .info-box.visible{display:block}
  .info-box p{font-size:13px;color:#AAA;line-height:1.55}
  .info-box p strong{color:#E8B84B}
  .info-box.hint{border-left:3px solid #E8B84B}
  .info-box.sauce{border-left:3px solid #4AAAD4}
  .info-box.tip{border-left:3px solid #44BB77;background:#0D1A10}
  .sauce-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#4AAAD4;margin-bottom:7px}
  .tip-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#44BB77;margin-bottom:7px}

  .next-btn{width:100%;background:#E8B84B;color:#0D0D0D;font-size:15px;font-weight:800;padding:14px;border-radius:12px;border:none;cursor:pointer;display:none;margin-top:4px}
  .next-btn.visible{display:block}

  #complete{display:none;position:fixed;inset:0;background:#0D0D0D;z-index:100;align-items:center;justify-content:center;flex-direction:column;padding:32px;text-align:center}
  #complete.visible{display:flex}
  #complete h2{font-size:28px;font-weight:900;margin-bottom:8px}
  #complete h2 span{color:#E8B84B}
  #complete p{color:#888;font-size:14px;margin-bottom:32px;line-height:1.6}
  .stars{font-size:40px;margin-bottom:16px;letter-spacing:4px}
  .restart-btn{background:#E8B84B;color:#0D0D0D;font-size:16px;font-weight:800;padding:16px;border-radius:100px;border:none;cursor:pointer;width:100%;max-width:280px}
</style>
</head>
<body>

<div id="splash">
  <div class="logo">ROKA DXB</div>
  <h1>Aprende el<br><span>Menú</span> 🍣</h1>
  <p>Lee el nombre en español, dilo en voz alta en inglés, luego escríbelo.</p>
  <div class="filter-label">Elige sección</div>
  <div class="filter-row" id="filter-row"></div>
  <button class="start-btn" onclick="startGame()">¡Empezar! →</button>
</div>

<div id="game-header" style="display:none">
  <div class="header-row">
    <span class="progress-label" id="progress-label">Plato 1 de 10</span>
    <div class="header-right">
      <span class="score-badge" id="score-badge">⭐ 0</span>
      <button class="menu-btn" onclick="goToMenu()">☰ Menú</button>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
</div>

<div id="card-area" style="display:none"></div>

<div id="complete">
  <div class="stars" id="stars">⭐⭐⭐</div>
  <h2>¡Bien <span>hecho!</span></h2>
  <p id="complete-msg"></p>
  <button class="restart-btn" onclick="restartGame()">Jugar de nuevo 🔄</button>
</div>

const SECTIONS = [...new Set(ALL_DISHES.map(d => d.section))];
let activeSections = [...SECTIONS];
let deck = [], current = 0, score = 0, hintsUsed = 0, cardComplete = false;
let revealedWords = [], revealedEn = false, revealedJp = false;
let weakDishes = {};

const filterRow = document.getElementById('filter-row');
SECTIONS.forEach(s => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn active';
  btn.textContent = s;
  btn.dataset.section = s;
  btn.onclick = () => {
    btn.classList.toggle('active');
    activeSections = [...document.querySelectorAll('.filter-btn.active')].map(b => b.dataset.section);
  };
  filterRow.appendChild(btn);
});

function shuffle(a){ return [...a].sort(()=>Math.random()-.5); }

function goToMenu(){
  document.getElementById('game-header').style.display='none';
  document.getElementById('card-area').style.display='none';
  document.getElementById('complete').classList.remove('visible');
  document.getElementById('splash').style.display='flex';
}

function startGame(){
  const base = shuffle(ALL_DISHES.filter(d => activeSections.includes(d.section)));
  if(!base.length){ alert('¡Selecciona al menos una sección!'); return; }
  deck = base.map((d,i) => ({...d, _id:i, _repeat:false}));
  weakDishes = {}; current = 0; score = 0;
  document.getElementById('splash').style.display = 'none';
  document.getElementById('game-header').style.display = 'block';
  document.getElementById('card-area').style.display = 'block';
  renderCard();
}

function restartGame(){
  document.getElementById('complete').classList.remove('visible');
  document.getElementById('splash').style.display = 'flex';
}

function norm(s){
  return s.toLowerCase()
    .replace(/[áàâ]/g,'a').replace(/[éèê]/g,'e').replace(/[íìî]/g,'i')
    .replace(/[óòô]/g,'o').replace(/[úùû]/g,'u').replace(/ü/g,'u').replace(/ñ/g,'n')
    .replace(/[^a-z0-9]/g,'');
}

function renderCard(){
  if(current >= deck.length){ showComplete(); return; }
  const d = deck[current];
  hintsUsed = 0; cardComplete = false;
  revealedEn = false; revealedJp = false;

  const repeatBadge = d._repeat ? ' 🔁' : '';
  document.getElementById('progress-label').textContent = `Plato ${current+1} de ${deck.length}${repeatBadge}`;
  document.getElementById('score-badge').textContent = `⭐ ${score}`;
  document.getElementById('progress-fill').style.width = ((current/deck.length)*100)+'%';

  if(d.type === 'fish'){
    renderFishCard(d);
  } else {
    renderDishCard(d);
  }
  setTimeout(()=>{ const i=document.getElementById('guess-input'); if(i) i.focus(); },150);
}

function checkGuess(){
  const d = deck[current];
  const input = document.getElementById('guess-input');
  const typed = input.value.trim();
  if(!typed) return;
  const words = d.en.split(' ');
  const typedWords = typed.toLowerCase().split(/\s+/);
  let newReveal = false;
  typedWords.forEach(tw => {
    words.forEach((w,i) => {
      if(revealedWords[i]) return;
      const clean = norm(w);
      if(clean.length >= 1 && norm(tw) === clean){
        revealedWords[i] = true; newReveal = true;
        document.getElementById('wc-'+i)?.classList.add('revealed');
      }
    });
  });
  const indices = words.map((w,i)=>norm(w).length>=1?i:null).filter(x=>x!==null);
  const allDone = indices.every(i=>revealedWords[i]);
  if(allDone && !cardComplete){
    cardComplete = true;
    const pts = hintsUsed===0?3:hintsUsed===1?2:1;
    score += pts;
    document.getElementById('score-badge').textContent = `⭐ ${score}`;
    document.getElementById('status-line').textContent = `🎉 +${pts} punto${pts>1?'s':''}! ${hintsUsed===0?'¡Perfecto!':'¡Bien hecho!'}`;
    input.classList.add('right'); input.disabled = true;
    document.getElementById('next-btn').classList.add('visible');
    if(d.sauce) document.getElementById('sauce-box')?.classList.add('visible');
    document.getElementById('tip-box')?.classList.add('visible');
    if(hintsUsed>0 && !d._repeat) weakDishes[d._id]=(weakDishes[d._id]||0)+1;
  } else if(newReveal){
    input.classList.remove('wrong'); input.value='';
    const remaining = indices.filter(i=>!revealedWords[i]).length;
    document.getElementById('status-line').textContent = `✅ ¡Bien! Faltan ${remaining} palabra${remaining!==1?'s':''}`;
  } else {
    input.classList.add('wrong');
    setTimeout(()=>input.classList.remove('wrong'),350);
  }
}

function checkFishGuess(){
  const d = deck[current];
  const input = document.getElementById('guess-input');
  const typed = input.value.trim().toLowerCase();
  if(!typed) return;
  const typedWords = typed.split(/\s+/);
  let newReveal = false;

  // Check English
  d.en.split(' ').forEach((w,i) => {
    if(revealedWords.en[i]) return;
    if(typedWords.some(tw => norm(tw) === norm(w))){
      revealedWords.en[i] = true; newReveal = true;
      document.getElementById('en-wc-'+i)?.classList.add('revealed');
    }
  });
  // Check Japanese
  d.japanese.split(' ').forEach((w,i) => {
    if(revealedWords.jp[i]) return;
    if(typedWords.some(tw => norm(tw) === norm(w))){
      revealedWords.jp[i] = true; newReveal = true;
      document.getElementById('jp-wc-'+i)?.classList.add('revealed');
    }
  });

  const enDone = revealedWords.en.every(Boolean);
  const jpDone = revealedWords.jp.every(Boolean);
  const allDone = enDone && jpDone;

  if(allDone && !cardComplete){
    cardComplete = true;
    const pts = hintsUsed===0?3:hintsUsed===1?2:1;
    score += pts;
    document.getElementById('score-badge').textContent = `⭐ ${score}`;
    document.getElementById('status-line').textContent = `🎉 +${pts} punto${pts>1?'s':''}! ¡Perfecto!`;
    input.classList.add('right'); input.disabled = true;
    document.getElementById('next-btn').classList.add('visible');
    document.getElementById('tip-box')?.classList.add('visible');
    if(hintsUsed>0 && !d._repeat) weakDishes[d._id]=(weakDishes[d._id]||0)+1;
  } else if(newReveal){
    input.classList.remove('wrong'); input.value='';
    const remaining = (!enDone?1:0) + (!jpDone?1:0);
    document.getElementById('status-line').textContent = `✅ ¡Bien! Falta ${remaining===1?'el otro nombre':'completar'}`;
  } else {
    input.classList.add('wrong');
    setTimeout(()=>input.classList.remove('wrong'),350);
  }
}

function showHint(n){
  if(hintsUsed>=n) return;
  hintsUsed=n;
  document.getElementById(`hint${n}-box`)?.classList.add('visible');
  document.getElementById(`h${n}-btn`)?.classList.add('used');
  document.getElementById(`h${n}-btn`).disabled=true;
  const rem=2-hintsUsed;
  document.getElementById('status-line').textContent=rem>0?`💡 Queda ${rem} pista${rem>1?'s':''}`:'💡 Sin más pistas';
}

function revealAll(){
  const d = deck[current];
  d.en.split(' ').forEach((_,i)=>{
    revealedWords[i]=true;
    document.getElementById('wc-'+i)?.classList.add('revealed');
  });
  cardComplete=true;
  if(!d._repeat) weakDishes[d._id]=(weakDishes[d._id]||0)+2;
  document.getElementById('status-line').textContent='👀 Revelado — ¡di la frase en voz alta!';
  document.getElementById('guess-input').disabled=true;
  document.getElementById('next-btn').classList.add('visible');
  if(d.sauce) document.getElementById('sauce-box')?.classList.add('visible');
  document.getElementById('tip-box')?.classList.add('visible');
}

function revealAllFish(){
  const d = deck[current];
  d.en.split(' ').forEach((_,i)=>{ revealedWords.en[i]=true; document.getElementById('en-wc-'+i)?.classList.add('revealed'); });
  d.japanese.split(' ').forEach((_,i)=>{ revealedWords.jp[i]=true; document.getElementById('jp-wc-'+i)?.classList.add('revealed'); });
  cardComplete=true;
  if(!d._repeat) weakDishes[d._id]=(weakDishes[d._id]||0)+2;
  document.getElementById('status-line').textContent='👀 Revelado — ¡di ambos nombres en voz alta!';
  document.getElementById('guess-input').disabled=true;
  document.getElementById('next-btn').classList.add('visible');
  document.getElementById('tip-box')?.classList.add('visible');
}

function nextCard(){
  current++;
  if(current>=deck.length){
    const repeats=[];
    Object.entries(weakDishes).forEach(([id,count])=>{
      const original=deck.find(d=>d._id===parseInt(id)&&!d._repeat);
      if(original){ const times=Math.min(count,2); for(let i=0;i<times;i++) repeats.push({...original,_repeat:true}); }
    });
    if(repeats.length>0){ deck=[...deck,...shuffle(repeats)]; weakDishes={}; }
  }
  renderCard();
}

function showComplete(){
  document.getElementById('game-header').style.display='none';
  document.getElementById('card-area').style.display='none';
  document.getElementById('complete').classList.add('visible');
  const max=deck.length*3; const pct=score/max;
  document.getElementById('stars').textContent=pct>=0.8?'⭐⭐⭐':pct>=0.5?'⭐⭐':'⭐';
  document.getElementById('complete-msg').textContent=`Puntuación: ${score} / ${max} — ${pct>=0.8?'¡Increíble! Estás listo para el servicio 🔥':pct>=0.5?'¡Bien! Sigue practicando 💪':'Sigue adelante — cada vez mejor 😊'}`;
}
</script>
</body>
</html>
